[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mwe-roberta-pipeline"
version = "0.1.0"
description = "Multilingual Transformer fine-tuning pipeline for PARSEME 2.0 MWE identification."
requires-python = ">=3.9"
dependencies = [
  "torch>=2.2",
  "transformers>=5.6.2",
  "accelerate>=0.28",
  "peft>=0.18",
  "tqdm>=4.66",
  "sentencepiece>=0.2",
  "protobuf>=4.25",
]

[project.scripts]
mwe-roberta = "mwe_roberta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
